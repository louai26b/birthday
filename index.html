<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" href="photo_6023885731262041039_x.jpg">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="test.css">
<title> Wiwita</title>

</head>
<body>
<audio id="galaxySound" loop>
    <source src="lucadialessandro-angelical-pad-143276.mp3" type="audio/mpeg">
</audio>
<div class="bg"></div>
<div class="nebula"></div>
<div class="overlay"></div>
<canvas id="stars"></canvas>

<div class="container">
    <h1>Birthday of Wiwi</h1>
    <div class="timer">     
        <div class="box"><div id="seconds" class="number">0</div><div class="label">seconds</div></div>
        <div class="box"><div id="minutes" class="number">0</div><div class="label">minutes</div></div>
        <div class="box"><div id="hours" class="number">0</div><div class="label">hours</div></div>
        <div class="box"><div id="days" class="number">0</div><div class="label">days</div></div>

    </div>
</div>

<script>
let started = false;
function startSound(){
    if(!started){
        const audio = document.getElementById("galaxySound");
        audio.play().then(() => {
            started = true;
            console.log(" sound is alerady play ");
        }).catch(e => {
            console.log("click to start sound", e);
        });
    }
}
document.addEventListener("click", startSound);
document.addEventListener("touchstart", startSound);
document.addEventListener("mousemove", startSound);


const targetDate = new Date("2026-05-09T00:00:00+01:00").getTime(); 
let last = {};
function pop(el){
    el.classList.add("pop");
    setTimeout(() => el.classList.remove("pop"), 400);
}
function update(){
    let diff = targetDate - Date.now();
    if(diff <= 0){
        document.querySelectorAll('.number').forEach(el => el.textContent = "00");
        return;
    }
    let vals = {
        days: Math.floor(diff / (1000*60*60*24)),
        hours: Math.floor((diff % (1000*60*60*24)) / (1000*60*60)),
        minutes: Math.floor((diff % (1000*60*60)) / (1000*60)),
        seconds: Math.floor((diff % (1000*60)) / 1000)
    };
    for(let k in vals){
        if(vals[k] !== last[k]){
            let el = document.getElementById(k);
            el.textContent = vals[k];
            pop(el);
        }
    }
    last = vals;
}
setInterval(update, 1000);
update();

const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");
function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let stars = [];
let sparks = [];
let mouse = {x: null, y: null};

for(let i = 0; i < 180; i++){
    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.5 + 0.5,
        v: Math.random() * 0.4 + 0.1
    });
}

window.addEventListener("mousemove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    createSpark(e.clientX, e.clientY);
});
window.addEventListener("touchmove", e => {
    let t = e.touches[0];
    mouse.x = t.clientX;
    mouse.y = t.clientY;
    createSpark(t.clientX, t.clientY);
});

function createSpark(x, y){
    for(let i = 0; i < 3; i++){ 
        sparks.push({
            x, y,
            dx: (Math.random()-0.5)*5,
            dy: (Math.random()-0.5)*5,
            life: 40
        });
    }
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    
    stars.forEach(s => {
        s.y += s.v;
        if(s.y > canvas.height) s.y = 0;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.fill();
    });
    
    // Sparks
    for(let i = sparks.length - 1; i >= 0; i--){
        let sp = sparks[i];
        sp.x += sp.dx;
        sp.y += sp.dy;
        sp.life--;
        ctx.fillStyle = `rgba(0,247,255,${sp.life/40})`;
        ctx.fillRect(sp.x, sp.y, 3, 3);
        if(sp.life <= 0) sparks.splice(i,1);
    }
    
    requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
